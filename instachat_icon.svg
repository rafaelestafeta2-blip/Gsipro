<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#0e172a" />
    </linearGradient>

    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c2ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00c2ff" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Chat Bubble -->
  <path filter="url(#glow)" d="M 112 80 H 400 C 452 80 460 122 460 175 V 315 C 460 368 418 410 365 410 H 215 L 125 475 V 410 C 75 410 52 368 52 315 V 175 C 52 122 60 80 112 80 Z" fill="url(#bubbleGrad)" />

  <!-- Sparkle Lines Top Left -->
  <path d="M 92 55 L 112 75 M 72 95 L 92 115" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />

  <!-- White Camera Body Inside -->
  <rect x="142" y="165" width="228" height="175" rx="52" fill="#ffffff" />

  <!-- Camera Top Bump -->
  <path d="M 205 165 L 225 135 H 287 L 307 165 Z" fill="#ffffff" />

  <!-- Lens Outer Ring -->
  <circle cx="256" cy="252" r="62" fill="url(#lensGrad)" />

  <!-- Lens Inner Reflection -->
  <circle cx="256" cy="252" r="36" fill="#1e1b4b" />
  <circle cx="240" cy="236" r="15" fill="#ffffff" opacity="0.9" />

  <!-- Small Flash Dot -->
  <circle cx="328" cy="195" r="13" fill="#00c2ff" />
</svg>
